plugins {
    alias libs.plugins.android.application
    alias libs.plugins.kotlin.android
}

android {
    compileSdk rootProject.ext.androidCompileSdk

    defaultConfig {
        applicationId 'com.vorlonsoft.android.rate.sample'
        minSdkVersion rootProject.ext.androidMinSdk
        targetSdkVersion rootProject.ext.androidCompileSdk
        versionCode appVersionCode
        versionName version
    }

    compileOptions {
        sourceCompatibility rootProject.ext.javaCompatibility
        targetCompatibility rootProject.ext.javaCompatibility
    }

    kotlinOptions {
        jvmTarget = rootProject.ext.javaCompatibility.toString()
    }

    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    buildTypes {
        configureEach {
            jniDebuggable false
            renderscriptDebuggable false
            renderscriptOptimLevel 3
            embedMicroApp false
        }
        release {
            applicationIdSuffix ''
            zipAlignEnabled true
            debuggable false
            postprocessing {
                removeUnusedCode true
                removeUnusedResources true
                obfuscate true
                optimizeCode true
                proguardFiles getDefaultProguardFile('proguard-defaults.txt'), 'project-proguard-rules.pro', 'proguard-rules.pro'
            }
        }
        debug {
            applicationIdSuffix '.debug'
            zipAlignEnabled false
            debuggable true
            postprocessing {
                removeUnusedCode false
                removeUnusedResources false
                obfuscate false
                optimizeCode false
            }
            matchingFallbacks = ['release']
        }
    }
    namespace 'com.vorlonsoft.android.rate.sample'
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${variant.name}-${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation project(':library')
    implementation libs.bundles.sample.implementation
}