plugins {
    alias libs.plugins.android.library
    alias libs.plugins.kotlin.android
}

android {
    compileSdk rootProject.ext.androidCompileSdk

    defaultConfig {
        minSdkVersion rootProject.ext.androidMinSdk
        targetSdkVersion rootProject.ext.androidCompileSdk
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility rootProject.ext.javaCompatibility
        targetCompatibility rootProject.ext.javaCompatibility
    }

    kotlinOptions {
        jvmTarget = rootProject.ext.javaCompatibility.toString()
    }

    buildTypes {
        release {
            postprocessing {
                removeUnusedCode false
                removeUnusedResources false
                obfuscate false
                optimizeCode true
                proguardFiles getDefaultProguardFile('proguard-defaults.txt'), 'project-proguard-rules.pro', 'proguard-rules.pro'
                testProguardFile 'project-test-proguard-rules.pro'
            }
        }
        debug {
            postprocessing {
                removeUnusedCode false
                removeUnusedResources false
                obfuscate false
                optimizeCode false
                testProguardFile 'project-test-proguard-rules.pro'
            }
            matchingFallbacks = ['release']
        }
    }
    namespace 'com.vorlonsoft.android.rate'
}

dependencies {
    api libs.bundles.library.api
    implementation libs.bundles.library.implementation

    androidTestImplementation libs.bundles.library.android.test
}