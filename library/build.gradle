plugins {
    alias libs.plugins.android.library
}

android {
    compileSdk = rootProject.ext.androidCompileSdk

    defaultConfig {
        minSdkVersion rootProject.ext.androidMinSdk
        targetSdkVersion rootProject.ext.androidCompileSdk
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility rootProject.ext.javaCompatibility
        targetCompatibility rootProject.ext.javaCompatibility
    }

    namespace 'com.vorlonsoft.android.rate'
}

dependencies {
    api libs.bundles.library.api
    implementation libs.bundles.library.implementation

    androidTestImplementation libs.bundles.library.android.test
}