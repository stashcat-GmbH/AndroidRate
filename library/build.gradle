plugins {
    alias libs.plugins.android.library
    alias libs.plugins.vanniktech.mavenPublish
}

android {
    compileSdk = rootProject.ext.androidCompileSdk
    namespace 'com.vorlonsoft.android.rate'

    defaultConfig {
        minSdkVersion rootProject.ext.androidMinSdk
        targetSdkVersion rootProject.ext.androidCompileSdk
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility rootProject.ext.javaCompatibility
        targetCompatibility rootProject.ext.javaCompatibility
    }
}

dependencies {
    implementation libs.bundles.library.implementation

    androidTestImplementation libs.bundles.library.android.test
}

// put license into aar and jar artifacts
tasks.withType(Zip).configureEach {
    if (name in ["bundleReleaseAar", "sourceReleaseJar", "javaDocReleaseJar"]) {
        from(rootProject.file("LICENSE")) {
            into("META-INF")
        }
    }
}

publishing {
    repositories {
        maven {
            name = "agsscrepo"
            url = uri("https://mvn.animegameservers.org/sc")

            credentials(PasswordCredentials)
        }
    }
}